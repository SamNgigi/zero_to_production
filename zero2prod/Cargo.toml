[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
anyhow = "1.0.102"
argon2 = { version = "0.5.3", features = ["std"] }
axum = "0.8.8"
axum-messages = "0.8.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
config = { version = "0.15.22", default-features = false, features = ["yaml"] }
rand = "0.10.1"
reqwest = { version = "0.13.2", features = ["cookies", "form", "json", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.149"
serde_with = "3.18.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "macros", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tower-sessions = "0.15.0"
tower-sessions-cookie-store = "0.5.2"
tower-sessions-redis-store = { version = "0.16.0", features = ["enable-rustls"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["registry", "fmt", "env-filter", "json"] }
unicode-segmentation = "1.13.2"
uuid = { version = "1.23.0", default-features = false, features = ["v7", "rng", "serde", "v4"] }
validator = "0.20.0"
wiremock = "0.6.5"

[dev-dependencies]
claim = "0.5.0"
fake = "5.1.0"
linkify = "0.11.0"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
reqwest = "0.13.2"

