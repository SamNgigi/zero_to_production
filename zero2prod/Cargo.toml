[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4.13.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
config = { version = "0.15.22", default-features = false, features = ["yaml"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "macros", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-actix-web = "0.7.21"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["registry", "fmt", "env-filter", "json"] }
unicode-segmentation = "1.13.2"
uuid = { version = "1.23.0", features = ["v7", "rng", "serde"] }
validator = "0.20.0"
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
serde_json = "1.0.149"
rand = "0.10.1"
thiserror = "2.0.18"
anyhow = "1.0.102"
base64 = "0.22.1"

[dev-dependencies]
claims = "0.8.0"
fake = "5.1.0"
linkify = "0.11.0"
once_cell = "1.21.4"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
wiremock = "0.6.5"
